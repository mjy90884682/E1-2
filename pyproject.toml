[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codyssey-quiz-game"
version = "0.1.0"
description = "Python 기초 학습을 위한 콘솔 퀴즈 게임"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quiz-game = "quiz_game.__main__:main"

[tool.setuptools]
package-dir = {"" = "quiz_game/src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["quiz_game/src"]

[tool.setuptools.package-data]
quiz_game = ["data/*.json"]
